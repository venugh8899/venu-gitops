apiVersion: apps/v1
kind: Deployment

metadata:
  name: venu-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: venu-app

  template:
    metadata:
      labels:
        app: venu-app

    spec:
      containers:
        - name: venu-app

          image: venudocker8899/venu-app:4

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"

            limits:
              cpu: "200m"
              memory: "256Mi"
